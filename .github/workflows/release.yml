name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v-prefixed tag to build
        required: true
        type: string

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: 22.18.0

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      prerelease: ${{ steps.version.outputs.prerelease }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout release revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          persist-credentials: false
      # Tags bypass branch protection and workflow_dispatch accepts any existing
      # tag. Refuse to publish a commit whose CI never passed.
      - name: Require a successful CI run for the release commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_sha="$(git rev-parse HEAD)"
          runs="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$release_sha&status=success&per_page=1" --jq '.total_count')"
          if [[ "$runs" -eq 0 ]]; then
            echo "::error::No successful CI run found for $release_sha. Wait for CI or rerun this workflow."
            exit 1
          fi
          echo "CI passed for $release_sha"
      - name: Set up Node.js and npm
        uses: ./.github/actions/setup-npm
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm ci
      - name: Validate tag and manifest versions
        id: version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          export GITHUB_REF_TYPE=tag
          export GITHUB_REF_NAME="$RELEASE_TAG"
          npm run check:versions
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          if [[ "$RELEASE_TAG" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

  build-and-publish:
    name: Build and publish Windows installer
    needs: validate
    runs-on: windows-2025
    timeout-minutes: 90
    environment:
      name: release
      url: https://github.com/${{ github.repository }}/releases/tag/${{ needs.validate.outputs.tag }}
    permissions:
      contents: write
    steps:
      - name: Checkout release revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.tag }}
          persist-credentials: false
      - name: Set up Node.js and npm
        uses: ./.github/actions/setup-npm
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.96.0
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            src-tauri
            src-tauri/thumbnail-provider
      - name: Install frontend dependencies
        run: npm ci
      # The build hooks download ~844 MiB of pinned models when the cache misses.
      # Cache the verified destination directories; the preparation scripts
      # re-check every digest, so a stale or partial cache cannot be packaged.
      # The key also covers the tracked MODEL.md files because the restore
      # extracts over the checkout and would otherwise ship a stale copy.
      - name: Restore model assets
        id: model-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            src-tauri/resources/semantic-search
            src-tauri/resources/storyboard-semantic
          key: model-assets-${{ runner.os }}-${{ hashFiles('scripts/prepare-semantic-assets.mjs', 'scripts/prepare-storyboard-semantic-assets.mjs', 'src-tauri/resources/*/MODEL.md') }}
      - name: Prepare verified model assets
        run: npm run prepare:semantic && npm run prepare:storyboard-semantic
      - name: Save model assets
        if: steps.model-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            src-tauri/resources/semantic-search
            src-tauri/resources/storyboard-semantic
          key: ${{ steps.model-cache.outputs.cache-primary-key }}
      - name: Require the official project build secret
        shell: pwsh
        env:
          LOCUTION_PRO_PROJECT_BUILD_SECRET_V1: ${{ secrets.LOCUTION_PRO_PROJECT_BUILD_SECRET_V1 || secrets.LINECUT_PROJECT_BUILD_SECRET_V1 }}
        run: |
          if (-not $env:LOCUTION_PRO_PROJECT_BUILD_SECRET_V1) {
            throw "The release environment is missing LOCUTION_PRO_PROJECT_BUILD_SECRET_V1"
          }
      - name: Prepare verified FFmpeg bundle assets
        run: npm run prepare:ffmpeg
      - name: Build thumbnail provider resource
        run: npm run build:thumbnail-provider
      - name: Build and publish release
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # action-v0.6.2
        env:
          GITHUB_TOKEN: ${{ github.token }}
          LOCUTION_PRO_PROJECT_BUILD_SECRET_V1: ${{ secrets.LOCUTION_PRO_PROJECT_BUILD_SECRET_V1 || secrets.LINECUT_PROJECT_BUILD_SECRET_V1 }}
        with:
          tagName: ${{ needs.validate.outputs.tag }}
          releaseName: Locution Pro ${{ needs.validate.outputs.tag }}
          generateReleaseNotes: true
          releaseDraft: true
          prerelease: ${{ needs.validate.outputs.prerelease }}
          includeUpdaterJson: false
          # Product name stays "Locution Pro"; only the published file name
          # drops the space so download URLs and CLI use need no escaping.
          assetNamePattern: "Locution.Pro_[version]_[arch][setup][ext]"
          retryAttempts: 2
