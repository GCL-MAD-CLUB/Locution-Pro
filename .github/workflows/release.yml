name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v-prefixed tag to build
        required: true
        type: string

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: 22.18.0

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      prerelease: ${{ steps.version.outputs.prerelease }}
      tag: ${{ steps.version.outputs.tag }}
      sha: ${{ steps.version.outputs.sha }}
    steps:
      - name: Checkout release revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ github.event.inputs.tag || github.ref_name }}
          persist-credentials: false
      # Tags bypass branch protection and workflow_dispatch accepts any existing
      # tag. Refuse to publish a commit whose CI never passed.
      - name: Require a successful CI run for the release commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_sha="$(git rev-parse HEAD)"
          runs="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$release_sha&status=success&event=push&per_page=100" --jq '[.workflow_runs[] | select(.head_branch == "main")] | length')"
          if [[ "$runs" -eq 0 ]]; then
            echo "::error::No successful CI run found for $release_sha. Wait for CI or rerun this workflow."
            exit 1
          fi
          echo "CI passed for $release_sha"
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Validate tag and manifest versions
        id: version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          export GITHUB_REF_TYPE=tag
          export GITHUB_REF_NAME="$RELEASE_TAG"
          node scripts/check-version-consistency.mjs
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          if [[ "$RELEASE_TAG" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

  build-and-publish:
    name: Build and publish Windows installer
    needs: validate
    runs-on: windows-2025
    timeout-minutes: 90
    environment:
      name: release
      url: https://github.com/${{ github.repository }}/releases/tag/${{ needs.validate.outputs.tag }}
    permissions:
      contents: write
    steps:
      - name: Checkout release revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.sha }}
          persist-credentials: false
      - name: Require the official project build secret
        shell: pwsh
        env:
          LOCUTION_PRO_PROJECT_BUILD_SECRET_V1: ${{ secrets.LOCUTION_PRO_PROJECT_BUILD_SECRET_V1 || secrets.LINECUT_PROJECT_BUILD_SECRET_V1 }}
        run: |
          if (-not $env:LOCUTION_PRO_PROJECT_BUILD_SECRET_V1) {
            throw "The release environment is missing LOCUTION_PRO_PROJECT_BUILD_SECRET_V1"
          }
      - name: Refuse to change an already published release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: |
          set -euo pipefail
          state="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[] | select(.tag_name == env.RELEASE_TAG) | .draft')"
          if [[ "$state" == false ]]; then
            echo "::error::This release is already public; use a new version"
            exit 1
          fi
      - name: Set up Node.js and npm
        uses: ./.github/actions/setup-npm
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.96.0
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            src-tauri
            src-tauri/thumbnail-provider
      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund
      # The build hooks download ~844 MiB of pinned models when the cache misses.
      # Cache the verified destination directories; the preparation scripts
      # re-check every digest, so a stale or partial cache cannot be packaged.
      # The key also covers the tracked MODEL.md files because the restore
      # extracts over the checkout and would otherwise ship a stale copy.
      - name: Restore model assets
        id: model-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            src-tauri/resources/semantic-search
            src-tauri/resources/storyboard-semantic
          key: model-assets-${{ runner.os }}-${{ hashFiles('scripts/prepare-semantic-assets.mjs', 'scripts/prepare-storyboard-semantic-assets.mjs', 'src-tauri/resources/*/MODEL.md') }}
      - name: Cache verified FFmpeg download
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/ffmpeg-assets/*/*.zip
          key: ffmpeg-${{ runner.os }}-${{ hashFiles('scripts/prepare-ffmpeg-assets.mjs') }}
      - name: Prepare verified FFmpeg bundle assets
        run: npm run prepare:ffmpeg
      # Tauri hooks prepare/check models once and build the thumbnail provider once.
      # Keep building separate from uploading so retries never rebuild the installer.
      - name: Build Windows installer
        env:
          LOCUTION_PRO_PROJECT_BUILD_SECRET_V1: ${{ secrets.LOCUTION_PRO_PROJECT_BUILD_SECRET_V1 || secrets.LINECUT_PROJECT_BUILD_SECRET_V1 }}
        run: npm run tauri -- build --ci -- --locked
      - name: Save verified model assets
        if: steps.model-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            src-tauri/resources/semantic-search
            src-tauri/resources/storyboard-semantic
          key: ${{ steps.model-cache.outputs.cache-primary-key }}
      - name: Generate release manifest and checksums
        run: npm run prepare:release
      - name: Preserve complete release artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-release-${{ needs.validate.outputs.tag }}
          path: dist/release
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Upload complete draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          RELEASE_SHA: ${{ needs.validate.outputs.sha }}
          PRERELEASE: ${{ needs.validate.outputs.prerelease }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$RELEASE_SHA"
          if ! gh release view "$RELEASE_TAG" --json isDraft > "$RUNNER_TEMP/release.json"; then
            flags=()
            if [[ "$PRERELEASE" == true ]]; then flags+=(--prerelease); fi
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "Locution Pro $RELEASE_TAG" --generate-notes "${flags[@]}"
          fi
          # Check again immediately before replacing draft assets on a retry.
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft')" = true
          test "$(gh release view "$RELEASE_TAG" --json isPrerelease --jq '.isPrerelease')" = "$PRERELEASE"
          files=("dist/release/Locution.Pro_${RELEASE_TAG#v}_x64-setup.exe" dist/release/latest.json dist/release/SHA256SUMS.txt)
          for attempt in 1 2 3; do
            if gh release upload "$RELEASE_TAG" "${files[@]}" --clobber; then
              exit 0
            fi
            if [[ "$attempt" -eq 3 ]]; then exit 1; fi
            sleep "$((attempt * 5))"
            test "$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft')" = true
          done
