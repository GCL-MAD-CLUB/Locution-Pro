name: Deploy site to Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - ".github/actions/setup-npm/action.yml"
      - ".github/workflows/deploy-site.yml"
      - "package.json"
      - "package-lock.json"
      - "scripts/check-site.mjs"
      - "scripts/build-site.mjs"
      - "wrangler.jsonc"
      - "site/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages
  cancel-in-progress: true

env:
  NODE_VERSION: 22.18.0
  CLOUDFLARE_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT || 'linecut-site' }}
  SITE_URL: ${{ vars.SITE_URL || 'https://locution.dpdns.org' }}

jobs:
  build:
    name: Package site
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js and npm
        uses: ./.github/actions/setup-npm
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm ci

      - name: Check and package site
        run: npm run site:build

      - name: Upload deployable site
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cloudflare-pages-site
          path: dist/site
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy site
    needs: build
    # Enable only after the Pages project and repository secrets exist.
    if: ${{ vars.CLOUDFLARE_PAGES_ENABLED == 'true' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: cloudflare-pages
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js and npm
        uses: ./.github/actions/setup-npm
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download deployable site
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cloudflare-pages-site
          path: dist/site

      # CLOUDFLARE_API_TOKEN needs Pages: Edit; CLOUDFLARE_ACCOUNT_ID is the
      # account that owns the linecut-site Pages project.
      - name: Deploy to Cloudflare Pages
        run: npx --yes wrangler@4.157.0 pages deploy --project-name="$CLOUDFLARE_PROJECT" --branch=main --commit-hash="$GITHUB_SHA" --commit-dirty=false
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
